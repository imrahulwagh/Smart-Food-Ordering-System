<!-- =========================================
     ADMIN LOGIN PAGE
========================================= -->

<section class="admin-login-page">

  <div class="admin-login-container">

    <!-- =======================================
         LEFT IMAGE SECTION
    ======================================== -->

    <div class="admin-login-image">

      <div class="image-overlay"></div>

      <div class="admin-image-content">

        <!-- ADMIN ICON -->

        <div class="admin-icon">

          <i class="bi bi-shield-lock"></i>

        </div>

        <!-- TITLE -->

        <h1>
          Foodie<br />
          Admin Panel
        </h1>

        <!-- DESCRIPTION -->

        <p>
          Manage orders, foods, customers and
          your food ordering system.
        </p>

      </div>

    </div>


    <!-- =======================================
         RIGHT LOGIN FORM SECTION
    ======================================== -->

    <div class="admin-login-form-section">

      <div class="admin-login-form">

        <!-- ===================================
             TITLE
        ==================================== -->

        <div class="admin-title">

          <div class="title-icon">

            <i class="bi bi-shield-check"></i>

          </div>

          <div>

            <p class="section-label">
              FOODIE
            </p>

            <h2>
              Admin Login
            </h2>

          </div>

        </div>


        <!-- SUBTITLE -->

        <p class="subtitle">
          Login to access the admin dashboard
        </p>


        <!-- ===================================
             ERROR / SUCCESS MESSAGE
        ==================================== -->

        <div
          *ngIf="message"
          class="login-message"
          [class.error-message]="messageType === 'error'"
          [class.success-message]="messageType === 'success'"
        >

          <i
            [class]="
              messageType === 'success'
                ? 'bi bi-check-circle'
                : 'bi bi-exclamation-circle'
            "
          ></i>

          <span>
            {{ message }}
          </span>

        </div>


        <!-- ===================================
             ADMIN USERNAME
        ==================================== -->

        <div class="form-group">

          <label>
            Admin Username
          </label>

          <div class="input-box">

            <i class="bi bi-person"></i>

            <input
              type="text"
              placeholder="Enter admin username"
              [(ngModel)]="username"
              (keyup.enter)="login()"
              [disabled]="loading"
              autocomplete="username"
            />

          </div>

        </div>


        <!-- ===================================
             ADMIN PASSWORD
        ==================================== -->

        <div class="form-group">

          <label>
            Password
          </label>

          <div class="input-box">

            <i class="bi bi-lock"></i>

            <input
              type="password"
              placeholder="Enter admin password"
              [(ngModel)]="password"
              (keyup.enter)="login()"
              [disabled]="loading"
              autocomplete="current-password"
            />

          </div>

        </div>


        <!-- ===================================
             ADMIN LOGIN BUTTON
        ==================================== -->

        <button
          type="button"
          class="admin-login-btn"
          (click)="login()"
          [disabled]="loading"
        >

          <span>
            {{ loading ? 'Logging in...' : 'Admin Login' }}
          </span>

          <!-- NORMAL ICON -->

          <i
            *ngIf="!loading"
            class="bi bi-arrow-right"
          ></i>

          <!-- LOADING ICON -->

          <i
            *ngIf="loading"
            class="bi bi-hourglass-split"
          ></i>

        </button>


        <!-- ===================================
             BACK TO USER LOGIN
        ==================================== -->

        <div class="back-login">

          <span>
            Not an admin?
          </span>

          <a
            routerLink="/login"
          >
            User Login
          </a>

        </div>

      </div>

    </div>

  </div>

</section>
