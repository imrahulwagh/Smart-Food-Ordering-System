<div class="register-page">

  <div class="register-card">

    <!-- Left Side -->
    <div class="register-image">

      <div class="overlay"></div>

      <div class="brand">
      </div>

      <div class="image-content">

        <h1>
          Good food.<br>
          Good mood.
        </h1>

        <p>
          Create your account and start ordering
          your favourite food.
        </p>

      </div>

    </div>


    <!-- Right Side -->
    <div class="register-form">

      <h2>
        Create Account 🍔
      </h2>

      <p class="subtitle">
        Join Foodie and order delicious food
      </p>


      <!-- ========================= -->
      <!-- SUCCESS / ERROR MESSAGE -->
      <!-- ========================= -->

      <div
        *ngIf="message"
        class="alert"
        [ngClass]="
          messageType === 'success'
            ? 'alert-success'
            : 'alert-danger'
        ">

        {{ message }}

      </div>


      <!-- ========================= -->
      <!-- Full Name -->
      <!-- ========================= -->

      <div class="form-group">

        <label>
          Full Name
        </label>

        <div class="input-box">

          <i class="bi bi-person"></i>

          <input
            type="text"
            [(ngModel)]="name"
            placeholder="Enter your full name">

        </div>

      </div>


      <!-- ========================= -->
      <!-- Email -->
      <!-- ========================= -->

      <div class="form-group">

        <label>
          Email Address
        </label>

        <div class="input-box">

          <i class="bi bi-envelope"></i>

          <input
            type="email"
            [(ngModel)]="email"
            placeholder="Enter your email">

        </div>

      </div>


      <!-- ========================= -->
      <!-- Mobile -->
      <!-- ========================= -->

      <div class="form-group">

        <label>
          Mobile Number
        </label>

        <div class="input-box">

          <i class="bi bi-phone"></i>

          <input
            type="tel"
            [(ngModel)]="phone"
            maxlength="10"
            placeholder="Enter your mobile number">

        </div>

      </div>


      <!-- ========================= -->
      <!-- Password -->
      <!-- ========================= -->

      <div class="form-group">

        <label>
          Password
        </label>

        <div class="input-box">

          <i class="bi bi-lock"></i>

          <input
            type="password"
            [(ngModel)]="password"
            placeholder="Create a password">

        </div>

      </div>


      <!-- ========================= -->
      <!-- Confirm Password -->
      <!-- ========================= -->

      <div class="form-group">

        <label>
          Confirm Password
        </label>

        <div class="input-box">

          <i class="bi bi-lock"></i>

          <input
            type="password"
            [(ngModel)]="confirmPassword"
            placeholder="Confirm your password">

        </div>

      </div>


      <!-- ========================= -->
      <!-- Register Button -->
      <!-- ========================= -->

      <button
        class="register-btn"
        type="button"
        (click)="register()"
        [disabled]="loading">

        {{ loading
          ? 'Creating Account...'
          : 'Create Account'
        }}

        <i
          *ngIf="!loading"
          class="bi bi-arrow-right">
        </i>

      </button>


      <!-- ========================= -->
      <!-- OR -->
      <!-- ========================= -->

      <div class="divider">

        <span>
          OR
        </span>

      </div>


      <!-- ========================= -->
      <!-- Google -->
      <!-- ========================= -->

      <button
        class="google-btn"
        type="button">

        <b>
          G
        </b>

        Continue with Google

      </button>


      <!-- ========================= -->
      <!-- Login -->
      <!-- ========================= -->

      <p class="login-text">

        Already have an account?

        <a routerLink="/login">
          Login
        </a>

      </p>

    </div>

  </div>

</div>
