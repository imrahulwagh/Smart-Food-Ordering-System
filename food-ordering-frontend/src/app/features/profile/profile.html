<div class="profile-page">

  <!-- TOP HEADER -->
  <div class="profile-top">

    <button
      class="back-btn"
      routerLink="/home">

      <i class="bi bi-arrow-left"></i>

    </button>

    <h2>My Profile</h2>

  </div>


  <!-- =====================================================
       LOADING
       ===================================================== -->

  <div
    *ngIf="loading"
    class="text-center py-5">

    <p>Loading profile...</p>

  </div>


  <!-- =====================================================
       PROFILE CARD
       ===================================================== -->

  <div
    class="profile-card"
    *ngIf="!loading && user">


    <!-- =================================================
         PROFILE ICON
         ================================================= -->

    <div class="profile-avatar">

      <i class="bi bi-person-fill"></i>

    </div>


    <!-- =================================================
         SUCCESS / ERROR MESSAGE
         This is outside editMode
         ================================================= -->

    <div
      *ngIf="message"
      class="alert text-center mb-3"
      [ngClass]="
        messageType === 'success'
          ? 'alert-success'
          : 'alert-danger'
      ">

      {{ message }}

    </div>


    <!-- =================================================
         NORMAL PROFILE VIEW
         ================================================= -->

    <div *ngIf="!editMode">

      <h3>
        Welcome, {{ user.full_name }}!
      </h3>

      <p class="profile-email">
        {{ user.email }}
      </p>


      <!-- =================================================
           PROFILE DETAILS
           ================================================= -->

      <div class="profile-details">


        <!-- FULL NAME -->
        <div class="detail">

          <div class="detail-icon">

            <i class="bi bi-person"></i>

          </div>

          <div>

            <span>
              Full Name
            </span>

            <strong>
              {{ user.full_name }}
            </strong>

          </div>

        </div>


        <!-- EMAIL -->
        <div class="detail">

          <div class="detail-icon">

            <i class="bi bi-envelope"></i>

          </div>

          <div>

            <span>
              Email Address
            </span>

            <strong>
              {{ user.email }}
            </strong>

          </div>

        </div>


        <!-- PHONE -->
        <div class="detail">

          <div class="detail-icon">

            <i class="bi bi-telephone"></i>

          </div>

          <div>

            <span>
              Phone Number
            </span>

            <strong>
              +91 {{ user.phone }}
            </strong>

          </div>

        </div>


        <!-- ADDRESS -->
        <div class="detail">

          <div class="detail-icon">

            <i class="bi bi-geo-alt"></i>

          </div>

          <div>

            <span>
              Address
            </span>

            <strong>
              Pune, Maharashtra
            </strong>

          </div>

        </div>

      </div>


      <!-- =================================================
           ACTION BUTTONS
           ================================================= -->

      <div class="profile-buttons">


        <!-- EDIT PROFILE -->
        <button
          class="edit-btn"
          type="button"
          (click)="editProfile()">

          <i class="bi bi-pencil"></i>

          Edit Profile

        </button>


        <!-- MY ORDERS -->
        <button
  type="button"
  class="orders-btn"
  (click)="goToOrders()">

  <i class="bi bi-bag-check"></i>
  My Orders

</button>


        <!-- LOGOUT -->
        <button
          class="logout-btn"
          type="button"
          (click)="logout()">

          <i class="bi bi-box-arrow-right"></i>

          Logout

        </button>

      </div>

    </div>


    <!-- =================================================
         EDIT PROFILE FORM
         ================================================= -->

    <div *ngIf="editMode">

      <h3>
        Edit Profile
      </h3>

      <p class="profile-email">
        Update your profile information
      </p>


      <!-- =================================================
           FULL NAME
           ================================================= -->

      <div class="form-group mb-3">

        <label>
          Full Name
        </label>

        <input
          type="text"
          class="form-control"
          [(ngModel)]="editName"
          placeholder="Enter your full name">

      </div>


      <!-- =================================================
           EMAIL
           ================================================= -->

      <div class="form-group mb-3">

        <label>
          Email Address
        </label>

        <input
          type="email"
          class="form-control"
          [value]="user.email"
          disabled>

      </div>


      <!-- =================================================
           PHONE
           ================================================= -->

      <div class="form-group mb-3">

        <label>
          Phone Number
        </label>

        <input
          type="text"
          class="form-control"
          [(ngModel)]="editPhone"
          maxlength="10"
          placeholder="Enter 10 digit phone number">

      </div>


      <!-- =================================================
           BUTTONS
           ================================================= -->

      <div class="profile-buttons">


        <!-- SAVE -->
        <button
          class="edit-btn"
          type="button"
          (click)="saveProfile()"
          [disabled]="saving">

          <i class="bi bi-check-lg"></i>

          {{ saving ? 'Saving...' : 'Save Changes' }}

        </button>


        <!-- CANCEL -->
        <button
          class="logout-btn"
          type="button"
          (click)="cancelEdit()">

          <i class="bi bi-x-lg"></i>

          Cancel

        </button>

      </div>

    </div>

  </div>


  <!-- =====================================================
       PROFILE ERROR
       ===================================================== -->

  <div
    *ngIf="!loading && !user"
    class="text-center py-5">

    <p>
      Unable to load profile.
    </p>

  </div>

</div>
